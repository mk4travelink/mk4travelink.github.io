---
layout: default
---

<aside class="sidebar">
  <header>
    <div class="about">
      <div class="cover-author-image">
        <a href="{{site.baseurl}}/"><img src="{{site.baseurl}}/assets/img/{% if site.author-img %}{{site.author-img}}{% endif %}" alt="{{site.author}}"></a>
      </div>
      <div class="author-name">{{site.author}}</div>
      <p>{{site.about-author}}</p>
    </div>
  </header> <!-- End Header -->
  <footer>
    <section class="contact">
      <h3 class="contact-title">Follow Us</h3>
      <ul>
        <li>
          <a href="https://medium.com/@mk4travelink" target="_blank">
            <i class="fa fa-medium" aria-hidden="true"></i> Medium
          </a>
        </li>
        <li>
          <a href="https://mk4travelink.substack.com/" target="_blank">
            <i class="fa fa-newspaper-o" aria-hidden="true"></i> Substack
          </a>
        </li>
        <li>
          <a href="https://youtube.com/@mk4promo-v5i?si=TsHkQfrOq9DLpNrm" target="_blank">
            <i class="fa fa-youtube" aria-hidden="true"></i> YouTube
          </a>
        </li>
        <li>
          <a href="https://benable.com/mk4travelink" target="_blank">
            <i class="fa fa-benable" aria-hidden="true"></i> Benable
          </a>
        </li>
        <li>
          <a href="https://mk4travelink.blogspot.com/" target="_blank">
            <i class="fa fa-globe" aria-hidden="true"></i> Blogger
          </a>
        </li>
        <li>
          <a href="https://www.pinterest.com/mk4travelink/" target="_blank">
            <i class="fa fa-pinterest" aria-hidden="true"></i> Pinterest
          </a>
        </li>
      </ul>
    </section> <!-- End Section Contact -->
    <div class="copyright">
      <p>{{site.time | date: '%Y'}} &copy; {{site.author}}</p>
    </div>
  </footer> <!-- End Footer -->
</aside> <!-- End Sidebar -->
<div class="content-box clearfix">
  {{ content }}
</div>
